[build-system]
requires = ["setuptools>=68.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "somnus-metadata"
version = "2.1.0"
description = "Universal semantic metadata standard and engineering toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

keywords = ["metadata", "markdown", "cli", "mcp", "sqlite"]

[project.urls]
Repository = "https://github.com/calisweetleaf/somnus-metadata"
Issues = "https://github.com/calisweetleaf/somnus-metadata/issues"

[project.scripts]
somnus = "somnus.cli:main"

[project.optional-dependencies]
dev = ["mypy>=1.9"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/somnus"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"somnus.db" = ["schema.sql", "search.sql"]

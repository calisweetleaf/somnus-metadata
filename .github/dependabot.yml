version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"

  # pyproject.toml declares no runtime dependencies by design (stdlib only), so
  # this ecosystem can only ever surface the `dev` extra (mypy) and the
  # setuptools build requirement. It must never be used to introduce a runtime
  # dependency.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      dev-tooling:
        patterns:
          - "*"

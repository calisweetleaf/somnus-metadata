# Tag-triggered release: test, build, verify the tag matches the package
# version, then publish a GitHub Release with auto-generated notes.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Test suite on the tagged tree
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests

      - name: Semantic check of SPEC and DECISIONS
        env:
          PYTHONPATH: src
        run: python -m somnus.cli check SPEC.md DECISIONS.md --level semantic

      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Verify the tag matches the package version
        run: |
          ver="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$ver" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version v$ver" >&2
            exit 1
          fi

      - name: Smoke test the built wheel outside the source tree
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import somnus; assert 'site-packages' in somnus.__file__, somnus.__file__"
          somnus --version

      - name: Publish the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
